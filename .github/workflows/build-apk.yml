name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Configure Android SDK permissions & licenses
        run: |
          if [ -d "$ANDROID_HOME" ]; then
            sudo chown -R $USER:$USER "$ANDROID_HOME" 2>/dev/null || true
          fi
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Self-healing & Environment Prep
        run: |
          # 1. Self-healing .env
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 2. Self-healing debug.keystore
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating fallback debug.keystore with keytool..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 3. Self-healing Gradle Wrapper JAR
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing, restoring..."
            if [ -f gradle/wrapper/gradle-wrapper.jar.base64 ]; then
              base64 -d gradle/wrapper/gradle-wrapper.jar.base64 > gradle/wrapper/gradle-wrapper.jar
            fi
            if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
              curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar || true
            fi
          fi

          # 4. Self-healing google-services.json
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"123456789","project_id":"heattreatment-exam"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:exam","android_client_info":{"package_name":"com.aistudio.heattreatment.exam"}},"oauth_client":[],"api_key":[{"current_key":"dummy_key"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
          fi

          # 5. Ensure gradlew is executable
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log || {
            BUILD_STATUS=$?
            echo "## ❌ Gradle Build Failed (Exit code $BUILD_STATUS)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $BUILD_STATUS
          }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-log
          path: build.log

      - name: Extract Version Name & Prepare APK
        id: extract_version
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -n 1 | cut -d '"' -f 2)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.2.3"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            DEST_APK="热处理中级工考试-v${VERSION_NAME}.apk"
            DEST_ENG="HeatTreatmentExam-v${VERSION_NAME}.apk"
            cp "$APK_PATH" "$DEST_APK"
            cp "$APK_PATH" "$DEST_ENG"
            cp "$APK_PATH" "app-release.apk"
            echo "APK_FILE=$DEST_APK" >> $GITHUB_OUTPUT
            echo "ENG_APK=$DEST_ENG" >> $GITHUB_OUTPUT
            echo "APK generated: $DEST_APK, $DEST_ENG and app-release.apk"
          else
            echo "APK not found!"
            exit 1
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-v${{ steps.extract_version.outputs.VERSION_NAME }}
          path: |
            ${{ steps.extract_version.outputs.APK_FILE }}
            ${{ steps.extract_version.outputs.ENG_APK }}
            app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        continue-on-error: true
        with:
          tag_name: v${{ steps.extract_version.outputs.VERSION_NAME }}
          name: 热处理中级工考试 v${{ steps.extract_version.outputs.VERSION_NAME }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.extract_version.outputs.APK_FILE }}
            ${{ steps.extract_version.outputs.ENG_APK }}
            app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
